<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina Niet Gevonden — Kwispelclub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',sans-serif;background:#FFF9F0;color:#2C2C2C;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;overflow:hidden;-webkit-font-smoothing:antialiased}
  h1,h2{font-family:'Fredoka',sans-serif}
  .paw-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .paw-bg .p{position:absolute;font-size:40px;opacity:0.04;animation:f 20s ease-in-out infinite}
  .paw-bg .p:nth-child(1){top:10%;left:8%;animation-delay:0s}
  .paw-bg .p:nth-child(2){top:30%;right:10%;animation-delay:3s;font-size:55px}
  .paw-bg .p:nth-child(3){bottom:20%;left:15%;animation-delay:6s;font-size:30px}
  .paw-bg .p:nth-child(4){top:60%;right:20%;animation-delay:9s}
  @keyframes f{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(10deg)}}
  .content{position:relative;z-index:1;max-width:480px}
  .big-emoji{font-size:120px;margin-bottom:16px;animation:bounce 2s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
  .error-code{font-size:clamp(80px,15vw,140px);font-weight:800;color:#E8F0E4;line-height:1;margin-bottom:-10px;letter-spacing:-4px}
  h1{font-size:28px;color:#2D5A27;margin-bottom:12px}
  p{font-size:16px;color:#5A5A5A;line-height:1.6;margin-bottom:28px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{padding:14px 28px;border-radius:50px;font-family:'Fredoka',sans-serif;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:#4A7C3F;color:white;box-shadow:0 4px 16px rgba(74,124,63,0.3)}
  .btn-primary:hover{background:#2D5A27;transform:translateY(-3px)}
  .btn-outline{background:transparent;color:#4A7C3F;border:2px solid #E8F0E4}
  .btn-outline:hover{background:#E8F0E4;transform:translateY(-3px)}
  .fun-text{margin-top:32px;font-size:14px;color:#8A8A8A}
  .fun-text span{cursor:pointer;transition:all 0.2s}
  .fun-text span:hover{font-size:24px}
</style>
</head>
<body>
<div class="paw-bg"><div class="p">🐾</div><div class="p">🐾</div><div class="p">🐾</div><div class="p">🐾</div></div>
<div class="content">
  <div class="big-emoji" id="emoji">🐕</div>
  <div class="error-code">404</div>
  <h1>Oeps! Deze pagina is weggelopen</h1>
  <p>Net als een ontsnapte puppy in het park — deze pagina is nergens te vinden. Misschien is hij achter een eekhoorn aan gerend?</p>
  <div class="btns">
    <a href="/" class="btn btn-primary">🏠 Terug naar Home</a>
    <a href="/contact" class="btn btn-outline">💬 Contact</a>
  </div>
  <div class="fun-text">Of probeer hem terug te lokken: <span onclick="callDog()">🦴</span> <span onclick="callDog()">🧶</span> <span onclick="callDog()">🥩</span></div>
</div>
<script>
  const emojis=['🐕','🐕‍🦺','🐩','🐶','🦮','🐾'];
  let i=0;
  function callDog(){
    const el=document.getElementById('emoji');
    el.style.transform='scale(1.3) rotate(10deg)';
    setTimeout(()=>{i=(i+1)%emojis.length;el.textContent=emojis[i];el.style.transform=''},300);
  }
</script>
</body>
</html>
